name: COD Assistant - Rebuild canonical FULL

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Target draft/release tag"
        required: true
        type: string
      baseline_tag:
        description: "Previous tag containing a FULL asset"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rebuild-full:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild canonical FULL and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TARGET_TAG: ${{ inputs.target_tag }}
          BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: |
          python - <<'PYCODE'
          import os,json,urllib.request,urllib.parse,urllib.error,zipfile,tempfile,shutil,hashlib,re
          from pathlib import Path
          token=os.environ['GH_TOKEN'];repo=os.environ['GH_REPOSITORY'];target_tag=os.environ['TARGET_TAG'];baseline_tag=os.environ['BASELINE_TAG']
          api=f'https://api.github.com/repos/{repo}'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'COD-Assistant-FULL-Builder/2'}
          preserve=('data/','backups/','A_TESTER/','DEV/','user_content/','imports/','exports/','MAJ/','releases/')
          managed={'app','scripts','runtime','core_catalog','docs','assets','reference_data','factory_base','cogs','foundation'}
          def req(url,method='GET',payload=None,accept=None,raw=None,ctype=None):
              h=dict(headers);data=raw
              if accept:h['Accept']=accept
              if payload is not None:data=json.dumps(payload).encode();h['Content-Type']='application/json'
              if ctype:h['Content-Type']=ctype
              r=urllib.request.Request(url,data=data,method=method,headers=h)
              with urllib.request.urlopen(r,timeout=900) as x:return x.status,x.read(),dict(x.headers.items())
          def jreq(url,method='GET',payload=None):
              st,b,h=req(url,method,payload);return st,(json.loads(b.decode()) if b else {}),h
          def releases():return jreq(api+'/releases?per_page=100')[1]
          def find_release(tag):
              for r in releases():
                  if str(r.get('tag_name'))==tag:return r
              raise RuntimeError('Release not found: '+tag)
          def asset(rel,pred):
              for a in rel.get('assets') or []:
                  if pred(str(a.get('name') or '')):return a
          def download(a,p):Path(p).write_bytes(req(a['url'],accept='application/octet-stream')[1])
          def delete(a):
              if not a:return
              try:req(a['url'],method='DELETE')
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
          def upload(rel,p,name=None):
              p=Path(p);nm=name or p.name;base=str(rel['upload_url']).split('{',1)[0];url=base+'?'+urllib.parse.urlencode({'name':nm});return json.loads(req(url,method='POST',raw=p.read_bytes(),ctype='application/zip' if nm.endswith('.zip') else 'application/octet-stream')[1].decode())
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
              return h.hexdigest()
          target=find_release(target_tag);base=find_release(baseline_tag);ba=asset(base,lambda n:n.endswith('_FULL.zip'));ua=asset(target,lambda n:n.endswith('_UPDATE.zip'))
          if not ba:raise RuntimeError('No baseline FULL')
          if not ua:raise RuntimeError('No temporary UPDATE in target')
          tmp=Path(tempfile.mkdtemp(prefix='cod_full_'))
          try:
              bz=tmp/'base.zip';uz=tmp/'update.zip';download(ba,bz);download(ua,uz);ex=tmp/'full';ex.mkdir()
              with zipfile.ZipFile(bz) as z:z.extractall(ex)
              roots=[p for p in ex.iterdir() if p.is_dir()];root=roots[0] if len(roots)==1 else ex
              with zipfile.ZipFile(uz) as z:
                  um=json.loads(z.read('update_manifest.json'))
                  for rel in um.get('replace') or []:
                      if rel.startswith(preserve) or '..' in Path(rel).parts:raise RuntimeError('Unsafe replace '+rel)
                      dst=(root/rel).resolve();dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(z.read(rel))
                  for rel in um.get('delete') or []:
                      if rel.startswith(preserve) or '..' in Path(rel).parts:raise RuntimeError('Unsafe delete '+rel)
                      dst=(root/rel).resolve()
                      if dst.is_file() or dst.is_symlink():dst.unlink(missing_ok=True)
              m=re.search(r'v(\d+)\.(\d+)\.(\d+)-rc(\d+)',target_tag,re.I);label=f'V{m.group(1)}_{m.group(2)}_{m.group(3)}_RC{m.group(4)}';full_name=f'COD_ASSISTANT_{label}_FULL.zip';fz=tmp/full_name
              with zipfile.ZipFile(fz,'w',zipfile.ZIP_DEFLATED,compresslevel=7) as z:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():z.write(p,(Path(root.name)/p.relative_to(root)).as_posix())
              full_sha=sha(fz)
              for a in list(target.get('assets') or []):
                  n=str(a.get('name') or '')
                  if n.endswith('_FULL.zip') or n=='sync_manifest.json' or n.startswith('COD_SYNC_B'):delete(a)
              full_remote=upload(target,fz,full_name)
              files={}
              with zipfile.ZipFile(fz) as z:
                  for zi in z.infolist():
                      if zi.is_dir():continue
                      member=zi.filename;parts=Path(member).parts;rel=Path(*parts[1:]).as_posix() if len(parts)>1 else member
                      if not rel or rel.startswith(preserve) or rel.split('/',1)[0] not in managed:continue
                      data=z.read(zi);files[rel]={'sha256':hashlib.sha256(data).hexdigest(),'size':len(data),'zip_member':member,'compress_size':zi.compress_size,'header_offset':zi.header_offset,'compress_type':zi.compress_type}
              manifest={'schema_version':4,'type':'COD_CANONICAL_FULL','target_tag':target_tag,'full_asset':full_name,'full_sha256':full_sha,'full_size':fz.stat().st_size,'generated_by':'github-actions','managed_roots':sorted(managed),'preserve':list(preserve),'files':files}
              oldm=asset(target,lambda n:n=='manifest.json');delete(oldm);mp=tmp/'manifest.json';mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8');upload(target,mp,'manifest.json')
              olds=asset(target,lambda n:n=='SHA256SUMS.txt');delete(olds);sp=tmp/'SHA256SUMS.txt';sp.write_text(f'{full_sha}  {full_name}\n{sha(mp)}  manifest.json\n',encoding='utf-8');upload(target,sp,'SHA256SUMS.txt')
              # UPDATE is only a private transport used to rebuild FULL. Remove it once the canonical FULL exists.
              delete(ua)
              print(json.dumps({'ok':True,'target':target_tag,'baseline':baseline_tag,'full':full_name,'files':len(files),'full_sha256':full_sha}))
          finally:shutil.rmtree(tmp,ignore_errors=True)
          PYCODE
